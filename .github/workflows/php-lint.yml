name: PHP Lint

on:
  pull_request:
    paths:
      - '**/*.php'
      - '.github/workflows/php-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
      - name: Validate PHP syntax
        shell: bash
        run: |
          set -uo pipefail
          checked=0
          failed=0
          report="$(mktemp)"
          trap 'rm -f "$report"' EXIT

          while IFS= read -r -d '' file; do
            checked=$((checked + 1))
            if output="$(php -l "$file" 2>&1)"; then
              continue
            fi

            failed=$((failed + 1))
            printf '\n::group::PHP syntax error: %s\n' "$file"
            printf '%s\n' "$output"
            echo "::endgroup::"
            {
              printf '### %s\n' "$file"
              printf '\x60\x60\x60text\n%s\n\x60\x60\x60\n\n' "$output"
            } >> "$report"
          done < <(find . -type f -name '*.php' \
            -not -path './vendor/*' \
            -not -path './node_modules/*' \
            -print0 | sort -z)

          echo "PHP files checked: $checked"
          echo "Files with syntax errors: $failed"
          {
            echo "## PHP 7.4 syntax check"
            echo ""
            echo "- Files checked: $checked"
            echo "- Files with syntax errors: $failed"
            echo ""
            if (( failed > 0 )); then
              cat "$report"
            else
              echo "All PHP files passed syntax validation."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if (( failed > 0 )); then
            echo "::error::$failed PHP file(s) failed syntax validation (out of $checked). See the job summary."
            exit 1
          fi
