name: Code Quality

on:
  pull_request:
    paths:
      - '**/*.php'
      - 'composer.json'
      - 'composer.lock'
      - 'phpcs.xml.dist'
      - 'phpstan.neon.dist'
      - 'phpstan-baseline.neon'
      - '.github/workflows/code-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phpstan:
    name: PHPStan (nivel 3, con baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpstan analyse --memory-limit=2G --no-progress --error-format=github

  phpcs:
    name: PHPCS (seguridad y PHP 7.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - name: Archivos nuevos (bloquean)
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only --diff-filter=A origin/${{ github.base_ref }}...HEAD -- '*.php')
          if [ ${#files[@]} -eq 0 ]; then echo "Sin archivos PHP nuevos."; exit 0; fi
          vendor/bin/phpcs --report=full "${files[@]}"
      - name: Archivos modificados (solo informan)
        shell: bash
        continue-on-error: true
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=M origin/${{ github.base_ref }}...HEAD -- '*.php')
          if [ ${#files[@]} -eq 0 ]; then echo "Sin archivos PHP modificados."; exit 0; fi
          vendor/bin/phpcs --report=full "${files[@]}" || echo "::warning::Hay avisos de PHPCS en archivos modificados (informativo)."

  secrets:
    name: Búsqueda de secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
