name: Release Auto Update

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-auto-update-main
  cancel-in-progress: true

jobs:
  release:
    name: Build and publish plugin release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check for BOM, mojibake and UTF-8 issues
        run: python .github/scripts/check_encoding.py

      - name: Calculate release version
        id: version
        run: |
          set -euo pipefail
          plugin_file="flacso-uruguay.php"
          current_version="$(grep -m1 -E '^\s*\* Version:\s*' "$plugin_file" | sed -E 's/^\s*\* Version:\s*//')"
          if [[ ! "$current_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(\.[0-9]+)?$ ]]; then
            echo "::error::Version invalida en $plugin_file: $current_version"
            exit 1
          fi

          base_version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          revision="$(git rev-list --count HEAD)"
          release_version="${base_version}.${revision}"
          tag="v${release_version}"
          release_name="FLACSO Uruguay ${release_version}"

          {
            echo "base_version=$base_version"
            echo "release_version=$release_version"
            echo "tag=$tag"
            echo "release_name=$release_name"
          } >> "$GITHUB_OUTPUT"

      - name: Package plugin zip
        id: package
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist/flacso-uruguay-plugin

          rsync -a ./ dist/flacso-uruguay-plugin/ \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude ".githooks/" \
            --exclude "node_modules/" \
            --exclude "vendor/" \
            --exclude "dist/" \
            --exclude "docs/" \
            --exclude "tests/" \
            --exclude ".gitignore" \
            --exclude "README.md" \
            --exclude "CHANGELOG.md" \
            --exclude "API.md" \
            --exclude "debug-*.php" \
            --exclude "test-schema.php" \
            --exclude "*.log"

          plugin_copy="dist/flacso-uruguay-plugin/flacso-uruguay.php"
          sed -i -E "s/^(\s*\* Version:\s*).*/\1${RELEASE_VERSION}/" "$plugin_copy"
          sed -i -E "s/define\('FLACSO_URUGUAY_VERSION', '[^']*'\);/define('FLACSO_URUGUAY_VERSION', '${RELEASE_VERSION}');/" "$plugin_copy"

          zip_path="flacso-uruguay-${RELEASE_VERSION}.zip"
          (cd dist && zip -rq "../${zip_path}" "flacso-uruguay-plugin")

          echo "zip_path=${zip_path}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.release_name }}
          artifacts: ${{ steps.package.outputs.zip_path }}
          generateReleaseNotes: true
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
