name: Deploy WordPress Plugin

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-wordpress-plugin-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  PLUGIN_SLUG: flacso-uruguay-plugin
  PLUGIN_FILE: flacso-uruguay.php
  WP_ROOT: /var/www/clients/client2/web5/web
  PLUGIN_TARGET: /var/www/clients/client2/web5/web/wp-content/plugins/flacso-uruguay-plugin

jobs:
  deploy:
    name: Validate and deploy plugin to production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify checkout and required files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f "$PLUGIN_FILE"
          test -f modules/shortcodes/includes/shortcodes-programa.php
          test -f modules/oferta-academica/includes/class-academic-team-editor.php

          symlink="$(find . -path './.git' -prune -o -type l -print -quit)"
          if [[ -n "$symlink" ]]; then
            echo "::error::Production package must not contain symbolic links: $symlink"
            exit 1
          fi

      - name: Calculate and apply software version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          current_version="$(grep -m1 -E '^\s*\* Version:\s*' "$PLUGIN_FILE" | sed -E 's/^\s*\* Version:\s*//')"
          if [[ ! "$current_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(\.[0-9]+)?$ ]]; then
            echo "::error::Invalid plugin version in $PLUGIN_FILE: $current_version"
            exit 1
          fi

          base_version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          revision="$(git rev-list --count HEAD)"
          software_version="${base_version}.${revision}"

          sed -i -E "s/^(\s*\* Version:\s*).*/\1${software_version}/" "$PLUGIN_FILE"
          sed -i -E "s/define\('FLACSO_URUGUAY_VERSION', '[^']*'\);/define('FLACSO_URUGUAY_VERSION', '${software_version}');/" "$PLUGIN_FILE"

          grep -Fq " * Version: ${software_version}" "$PLUGIN_FILE"
          grep -Fq "define('FLACSO_URUGUAY_VERSION', '${software_version}');" "$PLUGIN_FILE"

          echo "SOFTWARE_VERSION=$software_version" >> "$GITHUB_ENV"
          echo "software_version=$software_version" >> "$GITHUB_OUTPUT"
          echo "Software version for $GITHUB_SHA: $software_version"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check encoding
        shell: bash
        run: python .github/scripts/check_encoding.py

      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' \
            -not -path './vendor/*' \
            -not -path './node_modules/*' \
            -print0)

      - name: Run PHP contract tests
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' test_file; do
            echo "==> $test_file"
            php "$test_file"
          done < <(find tests -type f -name '*-test.php' -print0 | sort -z)

      - name: Build plugin ZIP artifact
        shell: bash
        run: |
          set -euo pipefail
          ZIP_NAME="${PLUGIN_SLUG}-${SOFTWARE_VERSION}-${GITHUB_SHA::7}.zip"
          zip -r "$ZIP_NAME" . \
            -x "$ZIP_NAME" \
               '.git/*' \
               '.github/*' \
               '.githooks/*' \
               'node_modules/*' \
               'vendor/*' \
               'docs/*' \
               'tests/*' \
               '.gitignore' \
               '.DS_Store' \
               'Thumbs.db' \
               'README.md' \
               '*/README.md' \
               'CHANGELOG.md' \
               '*/CHANGELOG.md' \
               'API.md' \
               '*/API.md' \
               'debug-*.php' \
               'test-schema.php' \
               '*.log'
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

      - name: Upload plugin ZIP artifact
        uses: actions/upload-artifact@v6
        with:
          name: plugin-zip-${{ steps.version.outputs.software_version }}-${{ github.sha }}
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          : "${EC2_HOST:?Missing EC2_HOST secret}"
          : "${EC2_USER:?Missing EC2_USER secret}"
          : "${EC2_SSH_KEY:?Missing EC2_SSH_KEY secret}"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_deploy_key
          chmod 600 ~/.ssh/ec2_deploy_key
          ssh-keyscan -H "$EC2_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload triggering commit to remote staging
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_STAGE="/tmp/${PLUGIN_SLUG}-${GITHUB_SHA}"
          SSH_OPTIONS=(-i ~/.ssh/ec2_deploy_key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          RSYNC_RSH="ssh ${SSH_OPTIONS[*]}"

          ssh "${SSH_OPTIONS[@]}" "$EC2_USER@$EC2_HOST" \
            bash -se -- "$REMOTE_STAGE" <<'REMOTE'
          remote_stage="$1"
          rm -rf -- "$remote_stage"
          install -m 700 -d "$remote_stage"
          REMOTE

          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.githooks/' \
            --exclude='node_modules/' \
            --exclude='vendor/' \
            --exclude='docs/' \
            --exclude='tests/' \
            --exclude='.gitignore' \
            --exclude='.DS_Store' \
            --exclude='Thumbs.db' \
            --exclude='README.md' \
            --exclude='CHANGELOG.md' \
            --exclude='API.md' \
            --exclude='debug-*.php' \
            --exclude='test-schema.php' \
            --exclude='*.log' \
            -e "$RSYNC_RSH" \
            ./ "$EC2_USER@$EC2_HOST:$REMOTE_STAGE/"

      - name: Activate files and smoke-test WordPress
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTIONS=(-i ~/.ssh/ec2_deploy_key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)

          ssh "${SSH_OPTIONS[@]}" "$EC2_USER@$EC2_HOST" \
            bash -se -- "$GITHUB_SHA" "$SOFTWARE_VERSION" <<'REMOTE'
          set -euo pipefail

          DEPLOY_SHA="$1"
          EXPECTED_VERSION="$2"
          SOURCE="/tmp/flacso-uruguay-plugin-${DEPLOY_SHA}"
          BACKUP="/tmp/flacso-uruguay-plugin-backup-${DEPLOY_SHA}"
          WP_ROOT="/var/www/clients/client2/web5/web"
          TARGET="${WP_ROOT}/wp-content/plugins/flacso-uruguay-plugin"
          PLUGIN_FILE="flacso-uruguay.php"
          MISSING_SHORTCODE='[FLACSO] Archivo no encontrado: modules/shortcodes/includes/shortcodes-programa.php'
          OPCACHE_TOKEN="$(openssl rand -hex 24)"
          OPCACHE_RESET_REL="flacso-deploy-opcache-reset-${DEPLOY_SHA}.php"
          RUNTIME_CHECK_REL="flacso-deploy-runtime-check-${DEPLOY_SHA}.php"
          OPCACHE_RESET_SOURCE="${SOURCE}/${OPCACHE_RESET_REL}"
          RUNTIME_CHECK_SOURCE="${SOURCE}/${RUNTIME_CHECK_REL}"
          OPCACHE_RESET_URL="https://flacso.edu.uy/wp-content/plugins/flacso-uruguay-plugin/${OPCACHE_RESET_REL}"
          RUNTIME_CHECK_URL="https://flacso.edu.uy/wp-content/plugins/flacso-uruguay-plugin/${RUNTIME_CHECK_REL}"

          local_request() {
            local url="$1"
            local body_file="$2"
            curl --silent --show-error --insecure \
              --resolve flacso.edu.uy:443:127.0.0.1 \
              --output "$body_file" \
              --write-out '%{http_code}' \
              "$url"
          }

          activated=0
          cleanup() {
            exit_code=$?
            if [[ "$exit_code" -ne 0 && "$activated" -eq 1 && -d "$BACKUP" ]]; then
              echo "Plugin validation failed; restoring previous files." >&2
              sudo -n /usr/bin/rsync \
                -a --delete --delay-updates \
                --chown=web5:client2 \
                --chmod=D755,F644 \
                "$BACKUP/" "$TARGET/" || true

              if [[ -f "$OPCACHE_RESET_SOURCE" ]]; then
                sudo -n /usr/bin/rsync \
                  -a --chown=web5:client2 --chmod=F644 \
                  "$OPCACHE_RESET_SOURCE" "$TARGET/$OPCACHE_RESET_REL" || true
                rollback_body="$(mktemp)"
                local_request "${OPCACHE_RESET_URL}?token=${OPCACHE_TOKEN}" "$rollback_body" >/dev/null || true
                rm -f -- "$rollback_body"
                sudo -n /usr/bin/rsync \
                  -a --delete --delay-updates \
                  --chown=web5:client2 \
                  --chmod=D755,F644 \
                  "$BACKUP/" "$TARGET/" || true
              fi
            fi
            rm -rf -- "$SOURCE"
            rm -rf -- "$BACKUP" || true
            exit "$exit_code"
          }
          trap cleanup EXIT

          test -f "$SOURCE/$PLUGIN_FILE"
          test -f "$SOURCE/modules/shortcodes/includes/shortcodes-programa.php"
          test -f "$SOURCE/modules/oferta-academica/includes/class-academic-team-editor.php"
          test -d "$WP_ROOT"
          test -d "$TARGET"
          test -f "$TARGET/$PLUGIN_FILE"

          install -d -m 700 "$BACKUP"
          /usr/bin/rsync -rt "$TARGET/" "$BACKUP/"

          # Petición 1: invalida OPcache en el FPM real que atiende el vhost.
          cat > "$OPCACHE_RESET_SOURCE" <<PHP
          <?php
          \$remote = (string) (\$_SERVER['REMOTE_ADDR'] ?? '');
          \$token = (string) (\$_GET['token'] ?? '');
          if (!in_array(\$remote, ['127.0.0.1', '::1'], true) || !hash_equals('${OPCACHE_TOKEN}', \$token)) {
              http_response_code(404);
              exit;
          }
          header('Content-Type: text/plain; charset=utf-8');
          \$state = 'unavailable';
          if (function_exists('opcache_reset')) {
              \$state = opcache_reset() ? 'reset' : 'not-reset';
          }
          echo 'opcache=' . \$state . ' php=' . PHP_VERSION . ' sapi=' . PHP_SAPI . ' preload=' . (string) ini_get('opcache.preload') . "\n";
          PHP

          # Petición 2: carga WordPress en un request nuevo y verifica la clase
          # sin colisiones que debe atender el editor de equipos.
          cat > "$RUNTIME_CHECK_SOURCE" <<PHP
          <?php
          \$remote = (string) (\$_SERVER['REMOTE_ADDR'] ?? '');
          \$token = (string) (\$_GET['token'] ?? '');
          if (!in_array(\$remote, ['127.0.0.1', '::1'], true) || !hash_equals('${OPCACHE_TOKEN}', \$token)) {
              http_response_code(404);
              exit;
          }
          header('Content-Type: text/plain; charset=utf-8');
          require dirname(__DIR__, 3) . '/wp-load.php';

          \$class = 'FLACSO_Academic_Team_Editor';
          \$class_ok = class_exists(\$class);
          \$method_ok = \$class_ok && method_exists(\$class, 'render_member_row');
          if (!\$method_ok) {
              http_response_code(500);
              \$parts = [
                  'team_editor_method=missing',
                  'php=' . PHP_VERSION,
                  'sapi=' . PHP_SAPI,
                  'preload=' . (string) ini_get('opcache.preload'),
              ];
              if (class_exists('FLACSO_Academic_Team_Admin')) {
                  try {
                      \$legacy = new ReflectionClass('FLACSO_Academic_Team_Admin');
                      \$parts[] = 'legacy_file=' . (string) \$legacy->getFileName();
                      \$parts[] = 'legacy_has_row=' . (method_exists('FLACSO_Academic_Team_Admin', 'render_member_row') ? '1' : '0');
                  } catch (Throwable \$e) {
                      \$parts[] = 'legacy_reflection_error=1';
                  }
              }
              echo implode(' ', \$parts) . "\n";
              exit;
          }

          \$reflection = new ReflectionClass(\$class);
          echo 'team_editor_method=ok php=' . PHP_VERSION
              . ' sapi=' . PHP_SAPI
              . ' file=' . (string) \$reflection->getFileName()
              . "\n";
          PHP

          sudo -n /usr/bin/rsync \
            -a --delete --delay-updates \
            --chown=web5:client2 \
            --chmod=D755,F644 \
            "$SOURCE/" "$TARGET/"
          activated=1

          test -f "$TARGET/$PLUGIN_FILE"
          test -f "$TARGET/modules/shortcodes/includes/shortcodes-programa.php"
          test -f "$TARGET/modules/oferta-academica/includes/class-academic-team-editor.php"
          test -f "$TARGET/$OPCACHE_RESET_REL"
          test -f "$TARGET/$RUNTIME_CHECK_REL"

          reset_body="$(mktemp)"
          reset_status="$(local_request "${OPCACHE_RESET_URL}?token=${OPCACHE_TOKEN}" "$reset_body")"
          reset_output="$(cat "$reset_body")"
          rm -f -- "$reset_body"
          printf 'FPM OPcache reset [%s]: %s\n' "$reset_status" "$reset_output"
          if [[ "$reset_status" != "200" ]]; then
            echo "Could not invalidate OPcache through the production FPM pool." >&2
            exit 1
          fi

          runtime_body="$(mktemp)"
          runtime_status="$(local_request "${RUNTIME_CHECK_URL}?token=${OPCACHE_TOKEN}" "$runtime_body")"
          runtime_output="$(cat "$runtime_body")"
          rm -f -- "$runtime_body"
          printf 'FPM runtime check [%s]: %s\n' "$runtime_status" "$runtime_output"
          if [[ "$runtime_status" != "200" || "$runtime_output" != team_editor_method=ok* ]]; then
            echo "The production FPM pool did not load the collision-free academic team editor." >&2
            exit 1
          fi

          rm -f -- "$OPCACHE_RESET_SOURCE" "$RUNTIME_CHECK_SOURCE"
          sudo -n /usr/bin/rsync \
            -a --delete --delay-updates \
            --chown=web5:client2 \
            --chmod=D755,F644 \
            "$SOURCE/" "$TARGET/"
          test ! -e "$TARGET/$OPCACHE_RESET_REL"
          test ! -e "$TARGET/$RUNTIME_CHECK_REL"

          WP_BIN="$(command -v wp)"
          test -n "$WP_BIN"

          validate_wordpress() {
            sudo -n -u web5 -- "$WP_BIN" --path="$WP_ROOT" core is-installed
            sudo -n -u web5 -- "$WP_BIN" --path="$WP_ROOT" plugin is-active flacso-uruguay-plugin
            deployed_version="$(sudo -n -u web5 -- "$WP_BIN" --path="$WP_ROOT" plugin get flacso-uruguay-plugin --field=version)"
            if [[ "$deployed_version" != "$EXPECTED_VERSION" ]]; then
              echo "Expected plugin version $EXPECTED_VERSION, found $deployed_version." >&2
              return 1
            fi
            echo "Deployed plugin version: $deployed_version"
          }

          if ! validation_output="$(validate_wordpress 2>&1)"; then
            printf '%s\n' "$validation_output"
            echo 'WordPress smoke test or plugin activation check failed.' >&2
            exit 1
          fi
          printf '%s\n' "$validation_output"

          sudo -n -u web5 -- "$WP_BIN" --path="$WP_ROOT" eval '
          if (!class_exists("FLACSO_Academic_Team_Editor") || !method_exists("FLACSO_Academic_Team_Editor", "render_member_row")) {
              fwrite(STDERR, "Collision-free academic team editor is incomplete.\n");
              exit(1);
          }
          $required_cpts = ["programa-academico", "oferta-academica", "cohorte", "seminario", "edicion", "tabla-precio"];
          foreach ($required_cpts as $cpt) {
              if (!post_type_exists($cpt)) {
                  fwrite(STDERR, "Required custom post type \"$cpt\" is not registered.\n");
                  exit(1);
              }
          }
          $catalog_response = rest_do_request(new WP_REST_Request("GET", "/flacso/v1/preinscripciones/catalogo"));
          if ($catalog_response->is_error() || $catalog_response->get_status() !== 200) {
              fwrite(STDERR, "Canonical Preinscriptions Catalog API is unavailable.\n");
              exit(1);
          }
          $programs_response = rest_do_request(new WP_REST_Request("GET", "/flacso/v1/programas-academicos"));
          if ($programs_response->is_error() || $programs_response->get_status() !== 200) {
              fwrite(STDERR, "Canonical Program API is unavailable.\n");
              exit(1);
          }
          $data = $catalog_response->get_data();
          if (!is_array($data) || !isset($data["items"])) {
              fwrite(STDERR, "Catalog API response is incomplete.\n");
              exit(1);
          }
          echo wp_json_encode(["catalog_items_count" => count($data["items"])]) . "\n";
          '

          if grep -Fq "$MISSING_SHORTCODE" <<< "$validation_output"; then
            echo "Shortcode file warning is still present after deployment." >&2
            exit 1
          fi

          echo "Commit $DEPLOY_SHA (version $EXPECTED_VERSION) deployed successfully to $TARGET"
          activated=0
          REMOTE
