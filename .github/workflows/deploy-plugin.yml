name: Deploy Plugin

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-plugin-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build/Deploy Plugin
    runs-on: ubuntu-latest
    env:
      WP_FTP_HOST: ${{ secrets.WP_FTP_HOST }}
      WP_FTP_USERNAME: ${{ secrets.WP_FTP_USERNAME }}
      WP_FTP_PASSWORD: ${{ secrets.WP_FTP_PASSWORD }}
      WP_FTP_SERVER_DIR: ${{ secrets.WP_FTP_SERVER_DIR }}
      WP_FTP_PROTOCOL: ${{ secrets.WP_FTP_PROTOCOL }}
      WP_FTP_PORT: ${{ secrets.WP_FTP_PORT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deploy secrets
        id: deploy_secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          required=(WP_FTP_HOST WP_FTP_USERNAME WP_FTP_PASSWORD WP_FTP_SERVER_DIR)
          for key in "${required[@]}"; do
            if [[ -z "${!key:-}" ]]; then
              missing+=("$key")
            fi
          done

          if [[ "${#missing[@]}" -gt 0 ]]; then
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FTP deploy deshabilitado: faltan secretos (${missing[*]})."
            echo "::warning::Se generara solo el ZIP del plugin como artifact."
          else
            echo "can_deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: PHP syntax check
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name "*.php" \
            -not -path "./vendor/*" \
            -not -path "./node_modules/*" \
            -print0)

      - name: Build plugin ZIP
        shell: bash
        run: |
          set -euo pipefail
          PLUGIN_SLUG="flacso-uruguay-plugin"
          ZIP_NAME="${PLUGIN_SLUG}-${GITHUB_SHA::7}.zip"
          zip -r "$ZIP_NAME" . \
            -x ".git/*" \
               ".github/*" \
               "node_modules/*" \
               "vendor/*" \
               ".DS_Store" \
               "Thumbs.db" \
               "*.log"
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

      - name: Upload plugin ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error

      - name: Deploy plugin files via FTP/SFTP
        if: steps.deploy_secrets.outputs.can_deploy == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.WP_FTP_HOST }}
          username: ${{ env.WP_FTP_USERNAME }}
          password: ${{ env.WP_FTP_PASSWORD }}
          protocol: ${{ env.WP_FTP_PROTOCOL || 'ftps' }}
          port: ${{ env.WP_FTP_PORT || 21 }}
          local-dir: ./
          server-dir: ${{ env.WP_FTP_SERVER_DIR }}
          state-name: .ftp-deploy-sync-state.json
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/vendor/**
            **/.DS_Store
            **/Thumbs.db
            **/README.md
            **/CHANGELOG.md
            **/*.log
