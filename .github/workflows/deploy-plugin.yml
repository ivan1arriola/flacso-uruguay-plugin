name: Deploy WordPress Plugin

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-wordpress-plugin-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  PLUGIN_SLUG: flacso-uruguay-plugin
  PLUGIN_FILE: flacso-uruguay.php
  WP_ROOT: /var/www/clients/client2/web5/web
  PLUGIN_TARGET: /var/www/clients/client2/web5/web/wp-content/plugins/flacso-uruguay-plugin

jobs:
  deploy:
    name: Validate and deploy plugin to production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify checkout and required files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f "$PLUGIN_FILE"
          test -f modules/shortcodes/includes/shortcodes-programa.php

          symlink="$(find . -path './.git' -prune -o -type l -print -quit)"
          if [[ -n "$symlink" ]]; then
            echo "::error::Production package must not contain symbolic links: $symlink"
            exit 1
          fi

      - name: Calculate and apply software version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          current_version="$(grep -m1 -E '^\s*\* Version:\s*' "$PLUGIN_FILE" | sed -E 's/^\s*\* Version:\s*//')"
          if [[ ! "$current_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(\.[0-9]+)?$ ]]; then
            echo "::error::Invalid plugin version in $PLUGIN_FILE: $current_version"
            exit 1
          fi

          base_version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          revision="$(git rev-list --count HEAD)"
          software_version="${base_version}.${revision}"

          sed -i -E "s/^(\s*\* Version:\s*).*/\1${software_version}/" "$PLUGIN_FILE"
          sed -i -E "s/define\('FLACSO_URUGUAY_VERSION', '[^']*'\);/define('FLACSO_URUGUAY_VERSION', '${software_version}');/" "$PLUGIN_FILE"

          grep -Fq " * Version: ${software_version}" "$PLUGIN_FILE"
          grep -Fq "define('FLACSO_URUGUAY_VERSION', '${software_version}');" "$PLUGIN_FILE"

          echo "SOFTWARE_VERSION=$software_version" >> "$GITHUB_ENV"
          echo "software_version=$software_version" >> "$GITHUB_OUTPUT"
          echo "Software version for $GITHUB_SHA: $software_version"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check encoding
        shell: bash
        run: python .github/scripts/check_encoding.py

      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' \
            -not -path './vendor/*' \
            -not -path './node_modules/*' \
            -print0)

      - name: Run PHP contract tests
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' test_file; do
            echo "==> $test_file"
            php "$test_file"
          done < <(find tests -type f -name '*-test.php' -print0 | sort -z)

      - name: Build plugin ZIP artifact
        shell: bash
        run: |
          set -euo pipefail
          ZIP_NAME="${PLUGIN_SLUG}-${SOFTWARE_VERSION}-${GITHUB_SHA::7}.zip"
          zip -r "$ZIP_NAME" . \
            -x "$ZIP_NAME" \
               '.git/*' \
               '.github/*' \
               '.githooks/*' \
               'node_modules/*' \
               'vendor/*' \
               'docs/*' \
               'tests/*' \
               '.gitignore' \
               '.DS_Store' \
               'Thumbs.db' \
               'README.md' \
               '*/README.md' \
               'CHANGELOG.md' \
               '*/CHANGELOG.md' \
               'API.md' \
               '*/API.md' \
               'debug-*.php' \
               'test-schema.php' \
               '*.log'
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

      - name: Upload plugin ZIP artifact
        uses: actions/upload-artifact@v6
        with:
          name: plugin-zip-${{ steps.version.outputs.software_version }}-${{ github.sha }}
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          : "${EC2_HOST:?Missing EC2_HOST secret}"
          : "${EC2_USER:?Missing EC2_USER secret}"
          : "${EC2_SSH_KEY:?Missing EC2_SSH_KEY secret}"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_deploy_key
          chmod 600 ~/.ssh/ec2_deploy_key
          ssh-keyscan -H "$EC2_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload triggering commit to remote staging
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_STAGE="/tmp/${PLUGIN_SLUG}-${GITHUB_SHA}"
          SSH_OPTIONS=(-i ~/.ssh/ec2_deploy_key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          RSYNC_RSH="ssh ${SSH_OPTIONS[*]}"

          ssh "${SSH_OPTIONS[@]}" "$EC2_USER@$EC2_HOST" \
            bash -se -- "$REMOTE_STAGE" <<'REMOTE'
          remote_stage="$1"
          rm -rf -- "$remote_stage"
          install -m 700 -d "$remote_stage"
          REMOTE

          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.githooks/' \
            --exclude='node_modules/' \
            --exclude='vendor/' \
            --exclude='docs/' \
            --exclude='tests/' \
            --exclude='.gitignore' \
            --exclude='.DS_Store' \
            --exclude='Thumbs.db' \
            --exclude='README.md' \
            --exclude='CHANGELOG.md' \
            --exclude='API.md' \
            --exclude='debug-*.php' \
            --exclude='test-schema.php' \
            --exclude='*.log' \
            -e "$RSYNC_RSH" \
            ./ "$EC2_USER@$EC2_HOST:$REMOTE_STAGE/"

      - name: Activate files and smoke-test WordPress
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTIONS=(-i ~/.ssh/ec2_deploy_key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)

          ssh "${SSH_OPTIONS[@]}" "$EC2_USER@$EC2_HOST" \
            bash -se -- "$GITHUB_SHA" "$SOFTWARE_VERSION" <<'REMOTE'
          set -euo pipefail

          DEPLOY_SHA="$1"
          EXPECTED_VERSION="$2"
          SOURCE="/tmp/flacso-uruguay-plugin-${DEPLOY_SHA}"
          BACKUP="/tmp/flacso-uruguay-plugin-backup-${DEPLOY_SHA}"
          WP_ROOT="/var/www/clients/client2/web5/web"
          TARGET="${WP_ROOT}/wp-content/plugins/flacso-uruguay-plugin"
          PLUGIN_FILE="flacso-uruguay.php"
          MISSING_SHORTCODE='[FLACSO] Archivo no encontrado: modules/shortcodes/includes/shortcodes-programa.php'

          activated=0
          cleanup() {
            exit_code=$?
            if [[ "$exit_code" -ne 0 && "$activated" -eq 1 && -d "$BACKUP" ]]; then
              echo "Plugin validation failed; restoring previous files." >&2
              sudo -n /usr/bin/rsync \
                -a --delete --delay-updates \
                --chown=web5:client2 \
                --chmod=D755,F644 \
                "$BACKUP/" "$TARGET/" || true
            fi
            rm -rf -- "$SOURCE"
            rm -rf -- "$BACKUP" || true
            exit "$exit_code"
          }
          trap cleanup EXIT

          test -f "$SOURCE/$PLUGIN_FILE"
          test -f "$SOURCE/modules/shortcodes/includes/shortcodes-programa.php"
          test -d "$WP_ROOT"
          test -d "$TARGET"
          test -f "$TARGET/$PLUGIN_FILE"

          install -d -m 700 "$BACKUP"
          /usr/bin/rsync -rt "$TARGET/" "$BACKUP/"

          sudo -n /usr/bin/rsync \
            -a --delete --delay-updates \
            --chown=web5:client2 \
            --chmod=D755,F644 \
            "$SOURCE/" "$TARGET/"
          activated=1

          test -f "$TARGET/$PLUGIN_FILE"
          test -f "$TARGET/modules/shortcodes/includes/shortcodes-programa.php"

          WP_BIN="$(command -v wp)"
          test -n "$WP_BIN"

          validate_wordpress() {
            sudo -n -u web5 -- "$WP_BIN" --path="$WP_ROOT" core is-installed
            sudo -n -u web5 -- "$WP_BIN" --path="$WP_ROOT" plugin is-active flacso-uruguay-plugin
            deployed_version="$(sudo -n -u web5 -- "$WP_BIN" --path="$WP_ROOT" plugin get flacso-uruguay-plugin --field=version)"
            if [[ "$deployed_version" != "$EXPECTED_VERSION" ]]; then
              echo "Expected plugin version $EXPECTED_VERSION, found $deployed_version." >&2
              return 1
            fi
            echo "Deployed plugin version: $deployed_version"
          }

          if ! validation_output="$(validate_wordpress 2>&1)"; then
            printf '%s\n' "$validation_output"
            echo 'WordPress smoke test or plugin activation check failed.' >&2
            exit 1
          fi
          printf '%s\n' "$validation_output"

          sudo -n -u web5 -- "$WP_BIN" --path="$WP_ROOT" eval '
          $required_cpts = ["programa-academico", "oferta-academica", "cohorte", "seminario", "edicion", "tabla-precio"];
          foreach ($required_cpts as $cpt) {
              if (!post_type_exists($cpt)) {
                  fwrite(STDERR, "Required custom post type \"$cpt\" is not registered.\n");
                  exit(1);
              }
          }
          $catalog_response = rest_do_request(new WP_REST_Request("GET", "/flacso/v1/preinscripciones/catalogo"));
          if ($catalog_response->is_error() || $catalog_response->get_status() !== 200) {
              fwrite(STDERR, "Canonical Preinscriptions Catalog API is unavailable.\n");
              exit(1);
          }
          $programs_response = rest_do_request(new WP_REST_Request("GET", "/flacso/v1/programas-academicos"));
          if ($programs_response->is_error() || $programs_response->get_status() !== 200) {
              fwrite(STDERR, "Canonical Program API is unavailable.\n");
              exit(1);
          }
          $data = $catalog_response->get_data();
          if (!is_array($data) || !isset($data["items"])) {
              fwrite(STDERR, "Catalog API response is incomplete.\n");
              exit(1);
          }
          echo wp_json_encode(["catalog_items_count" => count($data["items"])]) . "\n";
          '

          if grep -Fq "$MISSING_SHORTCODE" <<< "$validation_output"; then
            echo "Shortcode file warning is still present after deployment." >&2
            exit 1
          fi

          echo "Commit $DEPLOY_SHA (version $EXPECTED_VERSION) deployed successfully to $TARGET"
          activated=0
          REMOTE
