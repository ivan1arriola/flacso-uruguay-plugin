name: Deploy WordPress Plugin

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-wordpress-plugin-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy plugin to production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' \
            -not -path './vendor/*' \
            -not -path './node_modules/*' \
            -print0)

      - name: Build plugin ZIP artifact
        shell: bash
        run: |
          set -euo pipefail
          ZIP_NAME="flacso-uruguay-plugin-${GITHUB_SHA::7}.zip"
          zip -r "$ZIP_NAME" . \
            -x '.git/*' \
               '.github/*' \
               'node_modules/*' \
               'vendor/*' \
               '.DS_Store' \
               'Thumbs.db' \
               '*.log'
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

      - name: Upload plugin ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          : "${EC2_HOST:?Missing EC2_HOST secret}"
          : "${EC2_SSH_KEY:?Missing EC2_SSH_KEY secret}"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_deploy_key
          chmod 600 ~/.ssh/ec2_deploy_key

          if [[ -n "${EC2_KNOWN_HOSTS:-}" ]]; then
            printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$EC2_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Upload plugin to staging directory
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        shell: bash
        run: |
          set -euo pipefail
          : "${EC2_USER:?Missing EC2_USER secret}"

          REMOTE_STAGE="/tmp/flacso-uruguay-plugin-${GITHUB_SHA}"

          ssh \
            -i ~/.ssh/ec2_deploy_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$EC2_USER@$EC2_HOST" \
            "rm -rf '$REMOTE_STAGE' && mkdir -p '$REMOTE_STAGE'"

          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='vendor/' \
            --exclude='.githooks/' \
            --exclude='.DS_Store' \
            --exclude='Thumbs.db' \
            --exclude='*.log' \
            -e "ssh -i ~/.ssh/ec2_deploy_key -o BatchMode=yes -o IdentitiesOnly=yes" \
            ./ "$EC2_USER@$EC2_HOST:$REMOTE_STAGE/"

      - name: Activate plugin files
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/ec2_deploy_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$EC2_USER@$EC2_HOST" \
            "DEPLOY_SHA='$GITHUB_SHA' bash -se" <<'REMOTE'
          set -euo pipefail

          SOURCE="/tmp/flacso-uruguay-plugin-${DEPLOY_SHA}"
          TARGET="/var/www/flacso.edu.uy/web/wp-content/plugins/flacso-uruguay"

          cleanup() {
            rm -rf "$SOURCE"
          }
          trap cleanup EXIT

          test -f "$SOURCE/flacso-uruguay.php"
          test -d "$TARGET"
          test -f "$TARGET/flacso-uruguay.php"

          OWNER_GROUP="$(stat -c '%U:%G' "$TARGET")"
          sudo rsync -a --delete --chown="$OWNER_GROUP" "$SOURCE/" "$TARGET/"

          test -f "$TARGET/flacso-uruguay.php"
          echo "Plugin deployed successfully to $TARGET"
          REMOTE
