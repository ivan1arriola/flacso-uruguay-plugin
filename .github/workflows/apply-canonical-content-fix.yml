name: Apply canonical academic content fix

on:
  push:
    branches:
      - fix/preserve-canonical-academic-content

permissions:
  contents: write

jobs:
  apply-fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/preserve-canonical-academic-content
          fetch-depth: 0

      - name: Patch migrator and contract test
        shell: bash
        run: |
          python3 -c "import base64; exec(base64.b64decode(''))"
          php -l modules/instancias-oferta/includes/class-academic-model-migrator.php
          php -l tests/academic-model-migration-test.php
          php tests/academic-model-migration-test.php

      - name: Commit generated fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/instancias-oferta/includes/class-academic-model-migrator.php tests/academic-model-migration-test.php docs/academic-model-migration.md
          git diff --cached --check
          git commit -m "fix: preserve canonical academic content"
          git push origin HEAD:fix/preserve-canonical-academic-content
